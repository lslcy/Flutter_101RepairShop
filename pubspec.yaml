name: flutter_101repairshop
description: "101 RepairShop - Customer mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.0
  supabase_flutter: ^2.17.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  intl: ^0.19.0
  geolocator: ^14.1.0
  geocoding: ^5.0.0
  url_launcher: ^6.3.3
  http: ^1.6.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  country_picker: ^2.0.28
  phone_numbers_parser: ^9.0.28
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/Roboto-LICENSE.txt
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
